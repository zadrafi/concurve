on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

name: scan-bare-imports

jobs:
  scan-bare-imports:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      # The scanner resolves each Imports package's exports via
      # getNamespaceExports(), so the Imports dependencies must be installed.
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'

      - name: Scan for unqualified Imports-package calls
        run: Rscript tools/scan_bare_imports.R
