on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

name: repo-checks

jobs:
  scan-bare-imports:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      # The scanner resolves each Imports package's exports via
      # getNamespaceExports(), so the Imports dependencies must be installed.
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'

      - name: Scan for unqualified Imports-package calls
        run: Rscript tools/scan_bare_imports.R

  check-version-consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      # Doesn't need the package installed or its own Imports/Suggests --
      # pkgdown::check_pkgdown() and check_urls() work directly against the
      # source tree (DESCRIPTION, NAMESPACE, man/, _pkgdown.yml). yaml is
      # needed for the custom checks; pkgdown for the check_pkgdown() catch-all.
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::yaml, any::pkgdown
          dependencies: '"hard"'

      - name: Check NEWS.md/DESCRIPTION/_pkgdown.yml are consistent
        run: Rscript tools/check_version_consistency.R
